# Server Configuration
server:
  port: 8080

# Spring Configuration
spring:
  application:
    name: api-gateway
  
  profiles:
    active: dev
  
  cloud:
    gateway:
      # Route definitions
      routes:
        # Auth Service Route
        - id: auth-service
          uri: http://microservice-auth-dev:8080
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service
                fallbackUri: forward:/fallback/auth
        
        # Users Service Route  
        - id: users-service
          uri: http://microservice-auth-dev:8080
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RemoveRequestHeader=Origin
            - RemoveRequestHeader=Referer
            - name: CircuitBreaker
              args:
                name: users-service
                fallbackUri: forward:/fallback/users
        
        # Student Service Route
        - id: student-service
          uri: http://student-management-service-dev:8080
          predicates:
            - Path=/api/v1/students/**
          filters:
            - name: CircuitBreaker
              args:
                name: student-service
                fallbackUri: forward:/fallback/students
        
        # Teacher Service Route
        - id: teacher-service
          uri: http://microservice-teacher-dev:8080
          predicates:
            - Path=/api/v1/teachers/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: teacher-service
                fallbackUri: forward:/fallback/teachers
        
        # Notifications Service Route (REST)
        - id: notifications-service
          uri: http://notifications-service-dev:8080
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notifications-service
                fallbackUri: forward:/fallback/notifications
        
        # Notifications Service WebSocket Route
        - id: notifications-ws
          uri: ws://microservice-template-dev:8080
          predicates:
            - Path=/ws/notifications/**
        
        # Grade Management Service Route (Gestao de Notas)
        - id: grade-service
          uri: http://grade-management-service-dev:8080
          predicates:
            - Path=/api/v1/grades/**
          filters:
            - name: CircuitBreaker
              args:
                name: grade-service
                fallbackUri: forward:/fallback/grades
        
        # Class Management Service Route (Gestao de Turmas) - Classes
        - id: class-service-classes
          uri: http://microservice-template-dev:8080
          predicates:
            - Path=/api/v1/classes/**
          filters:
            - name: CircuitBreaker
              args:
                name: class-service
                fallbackUri: forward:/fallback/classes
        
        # Class Management Service Route (Gestao de Turmas) - Turmas
        - id: class-service-turmas
          uri: http://microservice-template-dev:8080
          predicates:
            - Path=/api/v1/turmas/**
          filters:
            - name: CircuitBreaker
              args:
                name: class-service
                fallbackUri: forward:/fallback/classes
        
        # Class Management Service Route (Gestao de Turmas) - Schedules
        - id: class-service-schedules
          uri: http://microservice-template-dev:8080
          predicates:
            - Path=/api/v1/schedules/**
          filters:
            - name: CircuitBreaker
              args:
                name: class-service
                fallbackUri: forward:/fallback/classes
        
        # Class Management Service Route (Gestao de Turmas) - Horarios
        - id: class-service-horarios
          uri: http://microservice-template-dev:8080
          predicates:
            - Path=/api/v1/horarios/**
          filters:
            - name: CircuitBreaker
              args:
                name: class-service
                fallbackUri: forward:/fallback/classes
      
      # Default filters applied to all routes
      default-filters:
        - AddRequestHeader=X-Gateway-Source, api-gateway
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, SERVICE_UNAVAILABLE
            methods: GET,POST
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
      
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://192.168.1.7:3000"
              - "http://192.168.1.7:5173"
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

# Circuit Breaker Configuration (Resilience4J)
resilience4j:
  circuitbreaker:
    configs:
      default:
        # Percentage of failed calls to open the circuit
        failure-rate-threshold: 50
        # Number of calls to evaluate failure rate
        sliding-window-size: 10
        # Minimum number of calls before circuit can open (set to 1 for immediate response)
        minimum-number-of-calls: 1
        # Time to wait before attempting to close the circuit (half-open state)
        wait-duration-in-open-state: 30s
        # Number of calls allowed in half-open state
        permitted-number-of-calls-in-half-open-state: 3
        # Exceptions that should be recorded as failures (connection errors, timeouts, etc.)
        record-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.net.UnknownHostException
          - java.net.SocketException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.server.ResponseStatusException
        # Whether to record exceptions that return specific status codes
        record-result: true
    instances:
      auth-service:
        baseConfig: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 1
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      users-service:
        baseConfig: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      student-service:
        baseConfig: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      teacher-service:
        baseConfig: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      notifications-service:
        baseConfig: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      grade-service:
        baseConfig: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      class-service:
        baseConfig: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  circuitbreaker:
    enabled: true

# Logging configuration
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
    io.github.resilience4j: INFO
    io.github.resilience4j.circuitbreaker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
